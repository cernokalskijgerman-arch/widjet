<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Nothing Phone 2x1 Widget</title>
  <style>
    :root {
      --nothing-red: #D71921;
      --glass-bg: rgba(20, 20, 24, 0.85);
      --glass-rim-1: rgba(255, 255, 255, 0.55);
      --glass-rim-2: rgba(255, 255, 255, 0.08);
      --glass-rim-3: rgba(255, 255, 255, 0.25);
      --font-sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-sys);
      display: flex;
    }

    /* Aggressive blocker for third-party host banners (DropHTML badge killer) */
    body > *:not(.widget-card),
    [class*="drophtml"],
    [id*="drophtml"],
    [href*="drophtml"],
    [style*="z-index: 2147483647"],
    [style*="z-index: 999999"],
    [style*="position: fixed"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      pointer-events: none !important;
    }

    /* 2x1 Full Responsive Liquid Glass Container (Edge-to-Edge) */
    .widget-card {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 6% 7%;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      isolation: isolate;
      background: var(--glass-bg);
      -webkit-backdrop-filter: saturate(185%) blur(24px);
      backdrop-filter: saturate(185%) blur(24px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Specular Sheen (Apple Liquid Glass) */
    .widget-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.03) 35%,
        transparent 70%
      );
    }

    /* Refraction Rim: 1px gradient bevel mask */
    .widget-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      padding: 1.5px;
      pointer-events: none;
      background: linear-gradient(135deg, var(--glass-rim-1) 0%, var(--glass-rim-2) 45%, var(--glass-rim-3) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }

    /* Top Row: Subject & Room */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .subject-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .status-dot {
      width: clamp(8px, 3vh, 13px);
      height: clamp(8px, 3vh, 13px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .status-dot.active-break {
      background: var(--nothing-red);
      box-shadow: 0 0 10px var(--nothing-red);
      animation: pulse-dot 1.8s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .subject-title {
      font-size: clamp(16px, 6.8vh, 28px);
      font-weight: 800;
      color: #f6f6f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .room-tag {
      font-size: clamp(12px, 4.5vh, 18px);
      font-weight: 700;
      color: #a0a0a8;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 7px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    /* Bottom Row: Time Start – End */
    .bottom-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      flex-shrink: 0;
    }

    .time-wrap {
      font-size: clamp(22px, 10.5vh, 48px);
      font-weight: 900;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 1;
    }

    .time-sep {
      color: #707076;
      font-weight: 500;
      font-size: 0.75em;
    }

    .break-badge {
      font-size: clamp(11px, 4.5vh, 18px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--nothing-red);
      display: none;
      line-height: 1;
    }

    .break-badge.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <!-- Top: Subject & Room -->
    <div class="top-row">
      <div class="subject-wrap">
        <span class="status-dot" id="dot"></span>
        <span class="subject-title" id="subject">Загрузка...</span>
      </div>
      <span class="room-tag" id="room">...</span>
    </div>

    <!-- Bottom: Time Range -->
    <div class="bottom-row">
      <div class="time-wrap">
        <span id="start">00:00</span>
        <span class="time-sep">–</span>
        <span id="end">00:00</span>
      </div>
      <span class="break-badge" id="breakBadge">СЛЕД</span>
    </div>
  </div>

  <script>
    // Remove any third-party injected banners continuously
    function cleanDOM() {
      document.querySelectorAll('body > *:not(.widget-card)').forEach(el => el.remove());
    }
    cleanDOM();
    setInterval(cleanDOM, 100);

    const SCHEDULE = {
      1: [ // Пн
        { subject: "Физика", room: "0228", start: "09:00", end: "09:40" },
        { subject: "История", room: "0332", start: "10:00", end: "10:40" },
        { subject: "Алгебра", room: "0325", start: "11:00", end: "11:40" },
        { subject: "Инд. проект", room: "0105", start: "12:00", end: "12:40" },
        { subject: "Русский язык", room: "0235", start: "12:50", end: "13:30" },
        { subject: "ОБЗР", room: "0321", start: "13:40", end: "14:20" },
        { subject: "Геометрия", room: "0325", start: "14:40", end: "15:20" }
      ],
      2: [ // Вт
        { subject: "Биология", room: "0220", start: "08:00", end: "08:40" },
        { subject: "Русский язык", room: "0235", start: "09:00", end: "09:40" },
        { subject: "Английский", room: "0110/0210", start: "10:00", end: "10:40" },
        { subject: "Литература", room: "0235", start: "11:00", end: "11:40" },
        { subject: "Обществознание", room: "0330", start: "12:00", end: "12:40" },
        { subject: "Геометрия", room: "0325", start: "12:50", end: "13:30" },
        { subject: "География", room: "0334", start: "13:40", end: "14:20" }
      ],
      3: [ // Ср
        { subject: "Информатика", room: "0212/0313", start: "08:00", end: "08:40" },
        { subject: "Информатика", room: "0212/0313", start: "09:00", end: "09:40" },
        { subject: "Физкультура", room: "Б. Зал", start: "10:00", end: "10:40" },
        { subject: "Обществознание", room: "0330", start: "11:00", end: "11:40" },
        { subject: "Вер. и стат.", room: "0325", start: "12:00", end: "12:40" },
        { subject: "Алгебра", room: "0325", start: "12:50", end: "13:30" }
      ],
      4: [ // Чт
        { subject: "Литература", room: "0235", start: "08:00", end: "08:40" },
        { subject: "Практ. русский", room: "0235", start: "09:00", end: "09:40" },
        { subject: "Физкультура", room: "Гимн. зал", start: "10:00", end: "10:40" },
        { subject: "Физика", room: "0228", start: "11:00", end: "11:40" },
        { subject: "Английский", room: "0110/0210", start: "12:00", end: "12:40" },
        { subject: "Алгебра", room: "0325", start: "12:50", end: "13:30" },
        { subject: "Химия", room: "0319", start: "13:40", end: "14:20" }
      ],
      5: [ // Пт
        { subject: "Информатика", room: "0212/0313", start: "08:00", end: "08:40" },
        { subject: "Информатика", room: "0212/0313", start: "09:00", end: "09:40" },
        { subject: "Алгебра", room: "0325", start: "10:00", end: "10:40" },
        { subject: "История", room: "0332", start: "11:00", end: "11:40" },
        { subject: "Английский", room: "0110/0210", start: "12:00", end: "12:40" },
        { subject: "Геометрия", room: "0325", start: "12:50", end: "13:30" },
        { subject: "Литература", room: "0235", start: "13:40", end: "14:20" }
      ]
    };

    function parseMin(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function tick() {
      const now = new Date();
      let d = now.getDay();
      if (d === 0 || d === 6) d = 1;

      const currentMins = now.getHours() * 60 + now.getMinutes();
      const dayList = SCHEDULE[d] || SCHEDULE[1];

      const first = dayList[0];
      const last = dayList[dayList.length - 1];
      const fStart = parseMin(first.start);
      const lEnd = parseMin(last.end);

      let subject = "";
      let room = "";
      let start = "";
      let end = "";
      let isBreak = false;

      if (currentMins < fStart) {
        subject = first.subject;
        room = first.room;
        start = first.start;
        end = first.end;
        isBreak = true;
      } else if (currentMins >= lEnd) {
        const nextDay = (d % 5) + 1;
        const nextFirst = SCHEDULE[nextDay][0];
        subject = "Уроки окончены";
        room = nextFirst.room;
        start = nextFirst.start;
        end = nextFirst.end;
        isBreak = false;
      } else {
        for (let i = 0; i < dayList.length; i++) {
          const cur = dayList[i];
          const cStart = parseMin(cur.start);
          const cEnd = parseMin(cur.end);

          if (currentMins >= cStart && currentMins < cEnd) {
            subject = cur.subject;
            room = cur.room;
            start = cur.start;
            end = cur.end;
            isBreak = false;
            break;
          }

          const next = dayList[i + 1];
          if (next && currentMins >= cEnd && currentMins < parseMin(next.start)) {
            subject = next.subject;
            room = next.room;
            start = next.start;
            end = next.end;
            isBreak = true;
            break;
          }
        }
      }

      document.getElementById('subject').textContent = subject;
      document.getElementById('room').textContent = room;
      document.getElementById('start').textContent = start;
      document.getElementById('end').textContent = end;

      const dot = document.getElementById('dot');
      const badge = document.getElementById('breakBadge');

      if (isBreak) {
        dot.className = 'status-dot active-break';
        badge.className = 'break-badge show';
      } else {
        dot.className = 'status-dot';
        badge.className = 'break-badge';
      }
    }

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
